[project]
name = "adlc-kit"
version = "0.1.0"
description = "The Python face of the adlc-kit hybrid: FastAPI service behind a uv-managed environment"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adlc_kit"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "fastapi.*"
# fastapi ships typed decorators; the star import surface mypy flags is framework-idiomatic.
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
